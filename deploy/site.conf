# 子站站点配置：软链到 /etc/nginx/conf.d/ins.itcsdn.com.conf
# 备案通过后补充 443 证书
server {
    listen 80;
    server_name ins.itcsdn.com;
    root /home/ins.itcsdn.com/out;
    index index.html;
    charset utf-8;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Next.js 静态导出为 about.html 形式，需 $uri.html 回退；缓存用 expires 避免覆盖安全头
    location /_next/static/ { expires 1y; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
}
